# Installed to /etc/systemd/logind.conf.d/ by install-never-sleep.sh.
# This host must never sleep; the lid only turns the panel off (Hyprland binds).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
