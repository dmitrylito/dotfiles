# Hides the Granite Ridge iGPU (gfx1036, 0000:0f:00.0) from ROCm for systemd user
# services (voxtype et al.), which never read ~/.zshenv. Device 0 is the 9070 XT
# (gfx1201) by PCI-enumeration order; re-check `rocminfo | grep gfx` if slots change.
# Only ROCm/HIP compute is affected — GL/Vulkan display paths ignore these.
ROCR_VISIBLE_DEVICES=0
HIP_VISIBLE_DEVICES=0
