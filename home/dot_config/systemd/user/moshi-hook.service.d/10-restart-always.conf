# The vendor unit ships Restart=on-failure, so a *clean* exit (status 0) is never
# restarted — e.g. after a self-update or graceful shutdown the daemon stays down
# until next login, silently killing notifications and agent mode.
# The previous hand-rolled unit used Restart=always; restore that.
# Kept as a drop-in so `moshi-hook service install` can rewrite the base unit
# without discarding this.
[Service]
Restart=always
