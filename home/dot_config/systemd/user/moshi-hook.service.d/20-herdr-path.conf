# Point the daemon at the herdr binary that matches the RUNNING herdr server.
#
# The vendor unit sets PATH=/usr/local/bin:/usr/bin:/bin, so the daemon found
# pacman's /usr/bin/herdr, which speaks a newer client protocol than a server
# started before that package landed. Every lookup then failed with
# protocol_mismatch and moshi-hook reported the pane with no cwd, tab or agent —
# the app's "jump to" loaded nothing and chat mode could not link to the session.
# The self-updating ~/.local/bin/herdr is the one kept in step with the server.
[Service]
Environment=PATH=%h/.local/bin:/usr/local/bin:/usr/bin:/bin
Environment=MOSHI_HERDR_PATH=%h/.local/bin/herdr
