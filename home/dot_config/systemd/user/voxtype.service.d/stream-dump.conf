# Debugging the words lost after pauses: the fork saves each streaming session's 16 kHz
# input and emitted text to this dir so failures can be replayed offline
# (~/.local/share/voxtype-mgx/replay). Newest 30 sessions kept. Remove this file to stop.
[Service]
Environment=VOXTYPE_STREAM_DUMP_DIR=%h/.cache/voxtype/stream-dumps
Environment=VOXTYPE_STREAM_DUMP_KEEP=30
