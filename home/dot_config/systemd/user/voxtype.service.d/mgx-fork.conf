# TEST: forked voxtype whose Parakeet encoder runs on MIGraphX directly instead of
# ONNX Runtime (ORT's MIGraphX EP rejects the encoder's 48 Pad nodes -> CPU fallback).
# Source: /home/dmitrylito/.local/share/voxtype-mgx (vx-1.1.2 + parakeet-rs-0.3.8 + ort-1.30.0)   Pad width 744 frames, program disk-cached under ~/.cache/voxtype/parakeet-mgx.
# ORT_MIGRAPHX_MODEL_CACHE_PATH is normally set by the /usr/bin/voxtype wrapper and is NOT
# optional: without it the decoder's migraphx_save fails and the node errors out.
# Revert: rm this file, systemctl --user daemon-reload, systemctl --user restart voxtype
[Service]
ExecStart=
ExecStart=/home/dmitrylito/.local/share/voxtype-mgx/vx-1.1.2/target/release/voxtype daemon
Environment=LD_LIBRARY_PATH=/opt/migraphx/lib
Environment=PARAKEET_MIGRAPHX_ENCODER=1
Environment=ORT_DYLIB_PATH=%h/.local/share/voxtype-mgx/ort-1.30.0/build/Linux/Release/libonnxruntime.so.1.30.0
Environment=ORT_MIGRAPHX_MODEL_CACHE_PATH=%h/.cache/voxtype/migraphx
Environment=PARAKEET_PAUSE_RESET_SECS=0
