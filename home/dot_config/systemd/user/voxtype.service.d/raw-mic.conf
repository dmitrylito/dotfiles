# Dictate from the raw fifine mic, not the NoiseTorch virtual source (which is the default source).
# voxtype captures through cpal's ALSA "default" PCM -> pipewire-alsa, which honors PIPEWIRE_NODE
# as its target.
[Service]
Environment=PIPEWIRE_NODE=alsa_input.usb-3142_fifine_Microphone-00.analog-stereo
