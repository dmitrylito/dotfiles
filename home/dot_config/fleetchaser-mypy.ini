; mypy config for the fleetchaser backend (Django-aware via django-stubs plugin).
; Used by the fc-mypy wrapper and nvim-lint. Lenient starter posture: the
; codebase is largely unannotated, so we don't dive into untyped bodies yet.
[mypy]
plugins = mypy_django_plugin.main
ignore_missing_imports = True
check_untyped_defs = False
cache_dir = ~/.cache/fleetchaser-mypy
; dmypy (daemon) rejects `follow_imports = silent`, so it's omitted (defaults to
; normal). Output flags live here rather than on the CLI so `dmypy check` emits
; the column/end format nvim-lint's parser expects.
show_column_numbers = True
show_error_end = True
error_summary = False
pretty = False
color_output = False

[mypy.plugins.django-stubs]
django_settings_module = fleetchaser.settings
