# Managed by chezmoi (PUBLIC dotfiles repo). Keep this file free of hostnames,
# IPs, and usernames — those stay local in ~/.ssh/config.

Host *
  # UseKeychain is macOS-only; ignore it on other profiles instead of erroring.
  IgnoreUnknown UseKeychain
  AddKeysToAgent yes
  UseKeychain yes
  IdentityFile ~/.ssh/id_ed25519
  # Detect a dead connection (e.g. after the laptop sleeps) within ~45s and
  # exit cleanly, instead of hanging as a zombie that leaks mouse-report bytes.
  ServerAliveInterval 15
  ServerAliveCountMax 3
