---
- name: Bootstrap and Sync Packages
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # `profile` arrives via --extra-vars from the explicit reconcile script. Normalise
    # once here rather than writing `profile | lower` at every use site.
    p: "{{ profile | lower }}"
    is_mac: "{{ (profile | lower) == 'mac' }}"
    is_linux: "{{ (profile | lower) in ['omarchy', 'server'] }}"
    # Homebrew must not run as root, so every user-scoped task escalates to
    # non_root_user on Linux and stays as the invoking user on macOS.
    as_user: "{{ (profile | lower) != 'mac' }}"

    # Decoded output of the SECTION 0 probe. Lazily evaluated, so it resolves on
    # first reference (after the probe has run), not at parse time.
    st: "{{ state_probe.stdout | from_json }}"

    # Upstream checkouts, all synced by the single task in SECTION 6.
    # `dest` is relative to the user's home; `only` restricts an entry to one
    # profile.
    git_repos:
      # Shell suggestion engine; .zshrc tolerates the first launch until cloned.
      - { repo: 'https://github.com/UtsavMandal2022/zsh-sage.git', dest: '.oh-my-zsh/custom/plugins/zsh-sage' }
      - { repo: 'https://github.com/MichaelAquilina/zsh-you-should-use.git', dest: '.oh-my-zsh/custom/plugins/you-should-use' }
      - { repo: 'https://github.com/zsh-users/zsh-syntax-highlighting.git', dest: '.oh-my-zsh/custom/plugins/zsh-syntax-highlighting' }
      # Omarchy shell plugin; shell.json (chezmoi-managed) references it by id.
      - { repo: 'https://github.com/omacom-io/omarchy-notification-center-plugin.git', dest: '.config/omarchy/plugins/omacom.notification-center', only: omarchy }

    # Base terminal essentials. Installed on ANY Linux system (Omarchy or
    # server); most already ship in Omarchy's base, so on omarchy this is a
    # safety net rather than real work.
    common_linux_packages:
      - git
      - zsh
      - sqlite
      - ripgrep
      - fzf
      - bat
      - eza
      - yazi
      - lazygit

    # Paths to Mac-specific auto-generated lists
    mac_brew_file: "{{ chezmoi_source_dir }}/packages/mac/brew.txt"
    mac_cask_file: "{{ chezmoi_source_dir }}/packages/mac/casks.txt"
    mac_taps_file: "{{ chezmoi_source_dir }}/packages/mac/taps.txt"

    # Homebrew refuses to LOAD a cask from a non-official tap until it is
    # trusted, so an untrusted entry here fails the cask install outright rather
    # than degrading. Fully-qualified names, kept in sync with casks.txt.
    mac_third_party_casks:
      - peteonrails/voxtype/voxtype

    # Hand-edited Omarchy lists (scripts/update_package_lists.sh records
    # decisions): common/ installs on every host, <host>/ adds to it, and
    # removed.txt at either level uninstalls and wins over both. st.host comes
    # from the probe's `hostname -s`.
    omarchy_dir: "{{ chezmoi_source_dir }}/packages/omarchy"
    omarchy_host_dir: "{{ omarchy_dir }}/{{ st.host }}"

    # Paths to server-specific auto-generated lists
    # (regenerate with scripts/update_server_package_lists.sh on the server)
    server_pacman_file: "{{ chezmoi_source_dir }}/packages/server/pacman.txt"
    server_aur_file: "{{ chezmoi_source_dir }}/packages/server/aur.txt"
    server_added_file: "{{ chezmoi_source_dir }}/packages/server/hosts/{{ st.host }}/added-pacman.txt"
    server_added_aur_file: "{{ chezmoi_source_dir }}/packages/server/hosts/{{ st.host }}/added-aur.txt"
    server_excluded_file: "{{ chezmoi_source_dir }}/packages/server/hosts/{{ st.host }}/excluded-pacman.txt"

    # archzfs unofficial binary repo (server ZFS — see SECTION 3).
    # Current signing key after the 2024 maintainer change; the old
    # ...F75D9D76 key is deprecated.
    archzfs_key: "3A9917BF0DED5C13F69AC68FABEC0A1208037BE9"
    archzfs_server: "https://github.com/archzfs/archzfs/releases/download/experimental"

    makeflags_line: 'MAKEFLAGS="-j$(nproc)"'

  tasks:
    # =========================================================================
    # SECTION 0: ONE-PASS STATE PROBE
    # =========================================================================
    # Every "has X already been done?" question this playbook asks is answered
    # here, in one task. On localhost a task that executes a module costs ~150ms
    # while all of these checks together cost ~5ms, so asking them as separate
    # stat/command tasks costs an order of magnitude more than the answers are
    # worth. Everything below is gated on this output, which is why a
    # fully-synced machine executes almost nothing.
    #
    # Emits one line of JSON, consumed as `st.<key>`. To add a gate, extend this
    # probe — do not add another check task.
    - name: Probe system state in one pass
      ansible.builtin.shell:
        cmd: |
          set -u
          # `eval echo ~user` resolves another user's home portably; macOS has
          # no getent.
          home=$(eval echo "~{{ non_root_user }}")
          yn() { if "$@" >/dev/null 2>&1; then printf true; else printf false; fi; }
          host=$(hostname -s 2>/dev/null || uname -n)
          # Packages whose last pacman.log event is a removal. The playbook
          # never reinstalls these; update_package_lists.sh asks about them.
          {% if p == 'omarchy' %}
          locally_removed=$(awk '/\[ALPM\] (installed|removed|upgraded|reinstalled|downgraded) /{a[$4]=$3}
            END{for (p in a) if (a[p] == "removed") print p}' /var/log/pacman.log 2>/dev/null | tr '\n' ' ')
          {% else %}
          locally_removed=
          {% endif %}

          installed=
          deps=
          if command -v pacman >/dev/null 2>&1; then
            installed=$(pacman -Qq | tr '\n' ' ')
            deps=$(pacman -Qdq | tr '\n' ' ')
          fi

          # Quotes are stripped so this can be embedded in the JSON line below;
          # gates substring-match cask names against it. brew keeps this at
          # $XDG_CONFIG_HOME/homebrew/ when that is set, else ~/.homebrew/.
          brew_trust=$(cat "$home/.config/homebrew/trust.json" \
                           "$home/.homebrew/trust.json" 2>/dev/null | tr -d ' \n"')

          {% if p == 'server' %}
          key_trusted=$(yn pacman-key --list-keys {{ archzfs_key }})
          {% else %}
          key_trusted=true
          {% endif %}

          printf '{'
          printf '"home":"%s",' "$home"
          printf '"host":"%s",' "$host"
          printf '"uid":"%s",' "$(id -u {{ non_root_user | quote }})"
          printf '"locally_removed":"%s",' "$locally_removed"
          printf '"installed":"%s",' "$installed"
          printf '"deps":"%s",' "$deps"
          printf '"omz":%s,' "$(yn test -f "$home/.oh-my-zsh/oh-my-zsh.sh")"
          printf '"makeflags":%s,' "$(yn grep -qxF '{{ makeflags_line }}' /etc/makepkg.conf)"
          printf '"brew_trust":"%s",' "$brew_trust"
          printf '"archzfs_key":%s' "$key_trusted"
          printf '}\n'
      register: state_probe
      changed_when: false
      # Read-only, and every gate below depends on it, so it must run even under
      # --check; otherwise `st` is undefined and a dry run cannot work at all.
      check_mode: false

    # Omarchy remains deliberately host-specific and does not publish package
    # transactions. Server hosts install the guarded replacement below.
    - name: Remove obsolete package-list auto-sync pacman hook (Omarchy)
      ansible.builtin.file:
        path: /etc/pacman.d/hooks/zz-chezmoi-package-sync.hook
        state: absent
      when: p == 'omarchy'

    # Resolve the package lists and diff them against the probe's installed set
    # ONCE. Every package action below is gated on these, so a synced machine
    # never invokes the pacman module at all — each invocation otherwise spends
    # ~350ms building a full package inventory (and ~570ms plus a mirror round
    # trip when it also refreshes the cache) only to conclude there is nothing
    # to do.
    - name: Compute package deltas
      when: is_linux
      vars:
        have: "{{ st.installed.split() }}"
        server_added: "{{ ((lookup('file', server_added_file, errors='ignore') | default('', true)).splitlines() | reject('match', '^#') | reject('match', '^$') | list) if p == 'server' else [] }}"
        server_added_aur: "{{ ((lookup('file', server_added_aur_file, errors='ignore') | default('', true)).splitlines() | reject('match', '^#') | reject('match', '^$') | list) if p == 'server' else [] }}"
        server_excluded: "{{ ((lookup('file', server_excluded_file, errors='ignore') | default('', true)).splitlines() | reject('match', '^#') | reject('match', '^$') | list) if p == 'server' else [] }}"
        server_native: "{{ (lookup('file', server_pacman_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list) if p == 'server' else [] }}"
        server_aur: "{{ (lookup('file', server_aur_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list) if p == 'server' else [] }}"
        omarchy_native: "{{ (((lookup('file', omarchy_dir ~ '/common/pacman.txt', errors='ignore') | default('', true)).splitlines() + (lookup('file', omarchy_host_dir ~ '/pacman.txt', errors='ignore') | default('', true)).splitlines()) | reject('match', '^#') | reject('match', '^$') | list) if p == 'omarchy' else [] }}"
        omarchy_aur: "{{ (((lookup('file', omarchy_dir ~ '/common/aur.txt', errors='ignore') | default('', true)).splitlines() + (lookup('file', omarchy_host_dir ~ '/aur.txt', errors='ignore') | default('', true)).splitlines()) | reject('match', '^#') | reject('match', '^$') | list) if p == 'omarchy' else [] }}"
        unwanted: "{{ (((lookup('file', omarchy_dir ~ '/removed.txt', errors='ignore') | default('', true)).splitlines() + (lookup('file', omarchy_host_dir ~ '/removed.txt', errors='ignore') | default('', true)).splitlines()) | reject('match', '^#') | reject('match', '^$') | list) if p == 'omarchy' else [] }}"
        skipped: "{{ server_excluded + unwanted + st.locally_removed.split() }}"
        want_native: "{{ (common_linux_packages + server_native + server_added + omarchy_native) | unique | difference(skipped) }}"
        want_aur: "{{ (server_aur + server_added_aur + omarchy_aur) | unique | difference(skipped) }}"
      ansible.builtin.set_fact:
        installed_packages: "{{ have }}"
        pacman_missing: "{{ want_native | difference(have) }}"
        # yay-bin bootstraps itself below; feeding it back into yay is a no-op
        aur_missing: "{{ want_aur | reject('equalto', 'yay-bin') | list | difference(have) }}"
        # Only hosts that declare ZFS in their added list get the archzfs stack.
        zfs_wanted: "{{ 'zfs-utils' in server_added }}"
        removed_present: "{{ unwanted | intersect(have) }}"
        # Declared but recorded as a dependency, so an orphan sweep would take it.
        declared_as_deps: "{{ ((want_native + want_aur) | intersect(st.deps.split())) if p == 'omarchy' else [] }}"
        yay_installed: "{{ 'yay' in have or 'yay-bin' in have }}"

    # =========================================================================
    # SECTION 1: BUILD CONFIGURATION (Omarchy & server profiles)
    # =========================================================================
    # Arch ships MAKEFLAGS commented out, so makepkg compiles on a single core
    # no matter how many the machine has. Everything AUR that actually builds
    # from source pays for it — llama.cpp-cuda (cmake+cudnn) worst of all.
    # Package compression is already threaded (COMPRESSZST uses -T0).
    # Must stay ahead of the AUR build in SECTION 4.
    - name: Build AUR packages with all available cores
      ansible.builtin.lineinfile:
        path: /etc/makepkg.conf
        regexp: '^#?\s*MAKEFLAGS='
        line: "{{ makeflags_line }}"
        validate: 'bash -n %s'
      when:
        - is_linux
        - not st.makeflags

    # makepkg's last debug/!debug wins. The -debug companions it would build
    # exist in no AUR repo and otherwise pile up as dependency packages.
    - name: Stop makepkg building -debug companion packages
      ansible.builtin.lineinfile:
        path: /etc/makepkg.conf
        line: "OPTIONS+=(!debug)"
        validate: 'bash -n %s'
      when: is_linux

    # =========================================================================
    # SECTION 2: MACOS HOMEBREW PACKAGES (Applied only to mac profile)
    # =========================================================================
    - name: Install Homebrew packages
      when: is_mac
      block:
        - name: Read mac brew taps, formulae and cask lists
          ansible.builtin.set_fact:
            mac_brew_taps: "{{ lookup('file', mac_taps_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"
            mac_brew_packages: "{{ lookup('file', mac_brew_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"
            mac_brew_casks: "{{ lookup('file', mac_cask_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        # homebrew_tap takes a list; looping it ran a separate brew process per tap
        - name: Add macOS Homebrew taps
          community.general.homebrew_tap:
            name: "{{ mac_brew_taps }}"
            state: present
          when: mac_brew_taps | length > 0

        - name: Install macOS Homebrew packages
          community.general.homebrew:
            name: "{{ mac_brew_packages }}"
            state: present
          when: mac_brew_packages | length > 0

        # Must precede the cask install: an untrusted third-party cask is a hard
        # load failure, not a prompt. Empty loop => no module invocation.
        - name: Trust third-party macOS casks
          ansible.builtin.command:
            cmd: "brew trust --cask {{ item }}"
          loop: "{{ mac_third_party_casks | reject('in', st.brew_trust) | list }}"
          changed_when: true

        - name: Install macOS Homebrew casks
          community.general.homebrew_cask:
            name: "{{ mac_brew_casks }}"
            state: present
            # Homebrew refuses a cask when its app already exists in
            # /Applications but is not yet registered as installed. Adopt
            # identical existing artifacts instead of failing the whole run.
            install_options:
              - adopt
          when: mac_brew_casks | length > 0

    # =========================================================================
    # SECTION 3: ZFS VIA ARCHZFS BINARY REPO (server profile only)
    # =========================================================================
    # zfs-dkms/zfs-utils used to be AUR source builds, which failed reliably
    # only on the headless server (PGP key import under makepkg --noconfirm,
    # plus DKMS module builds breaking on kernel/header mismatch). The archzfs
    # repo ships prebuilt, signed binaries instead.
    #
    # IMPORTANT: zfs-linux-lts is a precompiled module for the LTS kernel.
    # The server must BOOT linux-lts (not the regular `linux` kernel) for the
    # module to load — make linux-lts the default boot entry. archzfs is also
    # tagged "experimental" upstream and is version-locked to a specific
    # linux-lts release, so a kernel bump may have to wait for an archzfs build.
    - name: Drop the archzfs repository from servers without ZFS
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: "# {mark} ARCHZFS REPO (managed by chezmoi/ansible)"
        state: absent
      when:
        - p == 'server'
        - not (zfs_wanted | bool)

    - name: Set up archzfs binary repo and install ZFS (server)
      when:
        - p == 'server'
        - zfs_wanted | bool
      block:
        - name: Receive and locally sign the archzfs signing key
          ansible.builtin.command: "{{ item }}"
          loop:
            - "pacman-key --recv-keys {{ archzfs_key }} --keyserver hkps://keyserver.ubuntu.com"
            - "pacman-key --lsign-key {{ archzfs_key }}"
          when: not st.archzfs_key

        - name: Add the archzfs repository to pacman.conf
          ansible.builtin.blockinfile:
            path: /etc/pacman.conf
            marker: "# {mark} ARCHZFS REPO (managed by chezmoi/ansible)"
            block: |
              [archzfs]
              Server = {{ archzfs_server }}
          register: archzfs_repo

        # Only when the repo stanza or the key actually changed. Unconditional,
        # this cost a mirror round trip plus ~570ms of local database parsing on
        # every single server run.
        - name: Refresh package databases now that archzfs is configured
          community.general.pacman:
            update_cache: true
          when: archzfs_repo is changed or not st.archzfs_key

        # One-time migration off the old AUR build. The AUR zfs-dkms pins an
        # exact zfs-utils version; if archzfs ships an older zfs-utils, pacman
        # refuses to install the archzfs stack until zfs-dkms is gone. Gated on
        # the probe's installed set, so this is a no-op on every subsequent run
        # (and never touches the archzfs zfs-utils).
        - name: Remove the old AUR ZFS stack so archzfs can take over (server)
          community.general.pacman:
            name:
              - zfs-dkms
              - zfs-utils
            state: absent
          when: "'zfs-dkms' in installed_packages"

        - name: Install ZFS from archzfs (prebuilt, matched to linux-lts)
          community.general.pacman:
            name:
              - zfs-linux-lts
              - zfs-utils
            state: present
          when: "'zfs-linux-lts' not in installed_packages or 'zfs-utils' not in installed_packages"

    # nvidia-open-lts (prebuilt for the LTS kernel) provides NVIDIA-MODULE and
    # conflicts with the DKMS package it replaces. pacman --noconfirm can't
    # answer the "Remove nvidia-open-dkms?" prompt, so remove it ourselves
    # first. Gated on the probe's installed set: a one-time migration.
    - name: Remove nvidia-open-dkms so nvidia-open-lts can take over (server)
      community.general.pacman:
        name: nvidia-open-dkms
        state: absent
      when:
        - p == 'server'
        - "'nvidia-open-dkms' in installed_packages"

    # =========================================================================
    # SECTION 4: DYNAMIC PACKAGES (Omarchy & server profiles)
    # =========================================================================
    # Note: Omarchy's own defaults are NOT installed here; they ship with the OS.
    #
    # update_cache lives on this task rather than one of its own, so mirrors are
    # contacted only when there is genuinely something to install.
    #
    # The server is deliberately different: every playbook run is also its
    # maintenance run. Upgrade repository packages first (pacman -Syu), then
    # upgrade AUR packages below after yay is known to exist. Splitting the two
    # lets a new server bootstrap yay without attempting to run it as root.
    - name: Upgrade all repository packages (server)
      community.general.pacman:
        update_cache: true
        upgrade: true
      when: p == 'server'

    - name: Install missing native packages ({{ pacman_missing | default([]) | join(', ') }})
      community.general.pacman:
        name: "{{ pacman_missing }}"
        state: present
        update_cache: true
      when: pacman_missing | default([]) | length > 0

    # Install missing AUR packages independently so one broken PKGBUILD or
    # conflict cannot prevent the remaining packages or later playbook sections
    # from running. --useask lets yay automatically confirm package conflicts;
    # each non-zero result is reported below without failing the play.
    - name: Install or upgrade AUR packages
      when:
        - p == 'server' or aur_missing | default([]) | length > 0
      block:
        - name: Ensure base-devel is installed (required for makepkg)
          community.general.pacman:
            name: base-devel
            state: present

        - name: Allow the AUR build user to invoke pacman temporarily
          ansible.builtin.copy:
            dest: /etc/sudoers.d/99-chezmoi-aur-temp
            content: "{{ non_root_user }} ALL=(root) NOPASSWD: /usr/bin/pacman *\n"
            mode: '0440'
            validate: '/usr/sbin/visudo -cf %s'

        - name: Bootstrap yay if missing
          become: true
          become_user: "{{ non_root_user }}"
          when: not yay_installed
          block:
            - name: Clone yay-bin
              ansible.builtin.git:
                repo: https://aur.archlinux.org/yay-bin.git
                dest: "/tmp/yay-bin"
                version: master
                depth: 1

            - name: Build and install yay
              ansible.builtin.command:
                cmd: makepkg -si --noconfirm
                chdir: "/tmp/yay-bin"

            - name: Remove temporary clone directory
              ansible.builtin.file:
                path: "/tmp/yay-bin"
                state: absent

        # Signed AUR sources (e.g. zfs-dkms) need their PGP keys fetched at
        # build time; the default keyserver can stall dirmngr indefinitely.
        # gpg refuses to use a ~/.gnupg that is not 0700, and lineinfile's
        # create:true does not make missing parent directories.
        - name: Ensure ~/.gnupg exists for the build user
          ansible.builtin.file:
            path: "{{ st.home }}/.gnupg"
            state: directory
            mode: '0700'
          become: true
          become_user: "{{ non_root_user }}"

        - name: Point GPG at a reliable keyserver for AUR key imports
          ansible.builtin.lineinfile:
            path: "{{ st.home }}/.gnupg/gpg.conf"
            line: "keyserver hkps://keyserver.ubuntu.com"
            create: true
            mode: '0600'
          become: true
          become_user: "{{ non_root_user }}"

        # A hard async timeout per package so a stalled build/keyserver can
        # never hang the playbook forever.
        - name: Install missing AUR package
          ansible.builtin.command:
            argv:
              - yay
              - -S
              - --needed
              - --noconfirm
              - --noprogressbar
              - --batchinstall
              - --useask
              - "{{ item }}"
          become: true
          become_user: "{{ non_root_user }}"
          async: 7200
          poll: 15
          loop: "{{ aur_missing | default([]) }}"
          loop_control:
            label: "{{ item }}"
          register: aur_install_attempts
          failed_when: false
          changed_when: aur_install_attempts.rc == 0

        - name: Report AUR package install failure and continue
          ansible.builtin.debug:
            msg: >-
              WARNING: failed to install AUR package {{ item.item }}
              (rc={{ item.rc }}):
              {{ (item.stderr | default(item.stdout, true)) | trim }}
          loop: "{{ aur_install_attempts.results | default([]) }}"
          loop_control:
            label: "{{ item.item | default('unknown') }}"
          when: item.rc | default(0) != 0

        # Repository packages were upgraded above. -Sua limits this pass to
        # AUR/foreign packages instead of repeating pacman's full upgrade.
        - name: Upgrade installed AUR packages (server)
          ansible.builtin.command:
            cmd: yay -Sua --noconfirm --noprogressbar --batchinstall --useask
          become: true
          become_user: "{{ non_root_user }}"
          async: 7200
          poll: 15
          register: aur_upgrade_attempt
          failed_when: false
          changed_when: >-
            aur_upgrade_attempt.rc == 0 and
            'there is nothing to do' not in aur_upgrade_attempt.stdout | lower
          when: p == 'server'

        - name: Report AUR upgrade failure and continue
          ansible.builtin.debug:
            msg: >-
              WARNING: failed to upgrade installed AUR packages
              (rc={{ aur_upgrade_attempt.rc }}):
              {{ (aur_upgrade_attempt.stderr |
                  default(aur_upgrade_attempt.stdout, true)) | trim }}
          when:
            - p == 'server'
            - aur_upgrade_attempt.rc | default(0) != 0

      always:
        - name: Revoke passwordless sudo
          ansible.builtin.file:
            path: /etc/sudoers.d/99-chezmoi-aur-temp
            state: absent

    - name: Preview server package removals and install-reason changes
      ansible.builtin.command:
        argv:
          - "{{ chezmoi_source_dir }}/scripts/reconcile-server-package-set.sh"
          - --check
          - "{{ server_pacman_file }}"
          - "{{ server_aur_file }}"
          - "{{ server_excluded_file }}"
          - "{{ server_added_file }}"
          - "{{ server_added_aur_file }}"
      register: server_package_preview
      changed_when: "'already canonical' not in server_package_preview.stdout"
      check_mode: false
      when:
        - p == 'server'
        - ansible_check_mode
        - not (server_bootstrap | default(false) | bool)

    - name: Remove undeclared server packages and canonicalize install reasons
      ansible.builtin.command:
        argv:
          - "{{ chezmoi_source_dir }}/scripts/reconcile-server-package-set.sh"
          - "{{ server_pacman_file }}"
          - "{{ server_aur_file }}"
          - "{{ server_excluded_file }}"
          - "{{ server_added_file }}"
          - "{{ server_added_aur_file }}"
      register: server_package_reconcile
      changed_when: >-
        'Removing undeclared' in server_package_reconcile.stdout or
        'Marking retained dependencies' in server_package_reconcile.stdout or
        'marking ' in server_package_reconcile.stdout | lower
      when:
        - p == 'server'
        - not ansible_check_mode
        - not (server_bootstrap | default(false) | bool)

    - name: Mark declared packages explicitly installed ({{ declared_as_deps | default([]) | join(', ') }})
      ansible.builtin.command:
        argv: "{{ ['pacman', '-D', '--asexplicit', '--'] + declared_as_deps }}"
      when: declared_as_deps | default([]) | length > 0

    # Intersected with the installed set first: `state: absent` against an
    # already-clean list still pays the module's full ~350ms inventory build to
    # discover there is nothing to remove.
    - name: Remove unwanted packages ({{ removed_present | default([]) | join(', ') }})
      community.general.pacman:
        name: "{{ removed_present }}"
        state: absent
      when: removed_present | default([]) | length > 0

    # Every server boots Limine into the linux-lts UKI; the UKI embeds
    # /etc/kernel/cmdline and microcode (mkinitcpio `microcode` hook). The old
    # boot manager's firmware entries stay as a fallback behind Limine.
    - name: Boot servers through Limine into linux-lts
      when: p == 'server'
      block:
        - name: Build linux-lts as a UKI with a fallback image
          ansible.builtin.copy:
            dest: /etc/mkinitcpio.d/linux-lts.preset
            owner: root
            group: root
            mode: '0644'
            content: |
              # Managed by chezmoi playbook.yml
              ALL_kver="/boot/vmlinuz-linux-lts"
              PRESETS=('default' 'fallback')
              default_uki="/boot/EFI/Linux/arch-linux-lts.efi"
              fallback_uki="/boot/EFI/Linux/arch-linux-lts-fallback.efi"
              fallback_options="-S autodetect"
          register: lts_preset

        - name: Check for the linux-lts UKI
          ansible.builtin.stat:
            path: /boot/EFI/Linux/arch-linux-lts.efi
          register: lts_uki

        - name: Rebuild the linux-lts UKI
          ansible.builtin.command:
            argv: [mkinitcpio, -p, linux-lts]
          when: >-
            lts_preset is changed or not lts_uki.stat.exists or
            (pacman_missing | default([]) | intersect(['amd-ucode', 'intel-ucode']) | length > 0)

        - name: Ensure the local libexec directory exists
          ansible.builtin.file:
            path: /usr/local/libexec
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Install root-owned Limine deploy script
          ansible.builtin.copy:
            src: "{{ chezmoi_source_dir }}/scripts/server-limine.sh"
            dest: /usr/local/libexec/chezmoi-limine-sync
            owner: root
            group: root
            mode: '0755'

        - name: Ensure the pacman hook directory exists
          ansible.builtin.file:
            path: /etc/pacman.d/hooks
            state: directory
            owner: root
            group: root
            mode: '0755'

        # Sorts after 90-mkinitcpio-install, so rebuilt UKIs exist when it runs.
        - name: Redeploy Limine after limine or kernel changes
          ansible.builtin.copy:
            dest: /etc/pacman.d/hooks/99-limine.hook
            owner: root
            group: root
            mode: '0644'
            content: |
              [Trigger]
              Operation = Install
              Operation = Upgrade
              Type = Package
              Target = limine

              [Trigger]
              Operation = Install
              Operation = Upgrade
              Operation = Remove
              Type = Path
              Target = usr/lib/modules/*/vmlinuz

              [Action]
              Description = Deploying Limine and its boot entries...
              When = PostTransaction
              Exec = /usr/local/libexec/chezmoi-limine-sync

        - name: Deploy Limine and make it the first boot entry
          ansible.builtin.command:
            argv: [/usr/local/libexec/chezmoi-limine-sync]
          register: limine_sync
          changed_when: "'changed:' in limine_sync.stdout"

    # Matches DLCO-1/2, where the tailnet is fully trusted. Runtime and permanent
    # are set separately; a firewalld reload would make Docker rebuild its rules.
    - name: Trust the tailnet interface in firewalld (server)
      ansible.builtin.shell: |
        set -eu
        changed=
        if ! firewall-cmd --permanent --zone=trusted --query-interface=tailscale0 >/dev/null; then
          firewall-cmd --permanent --zone=trusted --add-interface=tailscale0 >/dev/null
          changed=1
        fi
        if [ "$(firewall-cmd --get-zone-of-interface=tailscale0 2>/dev/null || true)" != trusted ]; then
          firewall-cmd --zone=trusted --change-interface=tailscale0 >/dev/null
          changed=1
        fi
        [ -z "$changed" ] || echo changed
      register: tailnet_zone
      changed_when: "'changed' in tailnet_zone.stdout"
      when: p == 'server'

    # =========================================================================
    # SECTION 5: OH MY ZSH (All Profiles)
    # =========================================================================
    # Custom plugins are cloned by SECTION 6, which must therefore run after
    # this.
    - name: Install Oh My Zsh
      when: not st.omz
      block:
        - name: Download Oh My Zsh install script
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
            dest: /tmp/install_omz.sh
            mode: '0755'
          become: "{{ as_user }}"
          become_user: "{{ non_root_user }}"

        - name: Run Oh My Zsh install script
          ansible.builtin.shell: |
            export HOME="{{ st.home }}"
            export ZSH="$HOME/.oh-my-zsh"
            export KEEP_ZSHRC=yes

            if [ -d "$ZSH" ]; then
              mv "$ZSH" "${ZSH}.chezmoi_bak"
            fi

            /tmp/install_omz.sh --unattended

            if [ -d "${ZSH}.chezmoi_bak" ]; then
              rsync -a "${ZSH}.chezmoi_bak/" "$ZSH/"
              rm -rf "${ZSH}.chezmoi_bak"
            fi
          become: "{{ as_user }}"
          become_user: "{{ non_root_user }}"

    # =========================================================================
    # SECTION 6: UPSTREAM CHECKOUTS (zsh and Omarchy shell plugins)
    # =========================================================================
    # One task, every repo, fetched CONCURRENTLY. These were five separate
    # `ansible.builtin.git` tasks with update:true, which cost ~1.2s of serial
    # network latency plus ~600ms of task overhead on every run. `forks` cannot
    # parallelise a loop against a single host, so the concurrency lives here:
    # ~350ms wall clock, and upstream is still checked every single run.
    #
    # `git ls-remote` was measured at 1021ms vs 1340ms for the fetches it would
    # guard, so there is no cheap "did upstream move?" pre-check worth adding —
    # the TLS handshake is the cost, not the data.
    #
    # Prints one line per repo that actually moved, and refuses to discard local
    # modifications (matching ansible.builtin.git's force=false default).
    - name: Sync upstream checkouts
      ansible.builtin.shell:
        cmd: |
          set -u
          home={{ st.home | quote }}
          rc=0
          pids=

          sync_repo() {
            url=$1
            dest=$2
            if [ ! -d "$dest/.git" ]; then
              git clone -q --depth 1 "$url" "$dest" || return 1
              echo "cloned $dest"
              return 0
            fi
            git -C "$dest" fetch -q --depth 1 origin || return 1
            [ "$(git -C "$dest" rev-parse HEAD)" = "$(git -C "$dest" rev-parse FETCH_HEAD)" ] && return 0
            if [ -n "$(git -C "$dest" status --porcelain)" ]; then
              echo "skipped $dest: local modifications" >&2
              return 0
            fi
            git -C "$dest" reset -q --hard FETCH_HEAD || return 1
            echo "updated $dest"
          }

          {% for r in git_repos if r.only | default(p) == p %}
          sync_repo {{ r.repo | quote }} "$home/{{ r.dest }}" & pids="$pids $!"
          {% endfor %}
          for pid in $pids; do wait "$pid" || rc=1; done

          exit $rc
      register: upstream_sync
      changed_when: upstream_sync.stdout | trim | length > 0
      become: "{{ as_user }}"
      become_user: "{{ non_root_user }}"

    # =========================================================================
    # SECTION 7: SERVER PACKAGE PUBLICATION AND CONVERGENCE
    # =========================================================================
    - name: Configure automatic server package synchronization
      when:
        - p == 'server'
        - not (server_bootstrap | default(false) | bool)
      block:
        - name: Ensure the local libexec directory exists
          ansible.builtin.file:
            path: /usr/local/libexec
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Install root-owned package convergence worker
          ansible.builtin.copy:
            src: "{{ chezmoi_source_dir }}/scripts/converge-server-packages.sh"
            dest: /usr/local/libexec/chezmoi-server-package-converge
            owner: root
            group: root
            mode: '0755'

        - name: Ensure the pacman hook directory exists
          ansible.builtin.file:
            path: /etc/pacman.d/hooks
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Install server package-list pacman hook
          ansible.builtin.copy:
            dest: /etc/pacman.d/hooks/zz-chezmoi-package-sync.hook
            owner: root
            group: root
            mode: '0644'
            content: |
              [Trigger]
              Operation = Install
              Operation = Remove
              Type = Package
              Target = *

              [Action]
              Description = Scheduling server package-list synchronization...
              When = PostTransaction
              Exec = /usr/bin/runuser -u {{ non_root_user }} -- /usr/bin/env HOME={{ st.home }} XDG_RUNTIME_DIR=/run/user/{{ st.uid }} {{ chezmoi_source_dir }}/scripts/capture-server-package-lists.sh --schedule

        - name: Install system package convergence service
          ansible.builtin.copy:
            dest: /etc/systemd/system/chezmoi-server-package-converge.service
            owner: root
            group: root
            mode: '0644'
            content: |
              [Unit]
              Description=Converge committed chezmoi server packages
              Wants=network-online.target
              After=network-online.target

              [Service]
              Type=oneshot
              ExecStart=/usr/local/libexec/chezmoi-server-package-converge {{ chezmoi_source_dir }} {{ non_root_user }} {{ st.uid }}

        - name: Install system package convergence timer
          ansible.builtin.copy:
            dest: /etc/systemd/system/chezmoi-server-package-converge.timer
            owner: root
            group: root
            mode: '0644'
            content: |
              [Unit]
              Description=Poll for committed chezmoi server package changes

              [Timer]
              OnActiveSec=5min
              OnUnitActiveSec=15min
              RandomizedDelaySec=30s
              Persistent=true

              [Install]
              WantedBy=timers.target

        - name: Keep the server user's systemd manager available after logout
          ansible.builtin.command:
            argv: [loginctl, enable-linger, "{{ non_root_user }}"]
          changed_when: false

        - name: Enable the user package publication retry timer
          ansible.builtin.systemd_service:
            name: chezmoi-package-capture.timer
            scope: user
            daemon_reload: true
            enabled: true
            state: started
          become: true
          become_user: "{{ non_root_user }}"
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ st.uid }}"

        # Lets the sync listener start the converge the moment a push lands;
        # the timer already runs the same unit on the same committed content.
        - name: Allow the server user to start package convergence
          ansible.builtin.copy:
            dest: /etc/polkit-1/rules.d/50-chezmoi-package-converge.rules
            owner: root
            group: root
            mode: '0644'
            content: |
              polkit.addRule(function(action, subject) {
                if (action.id == "org.freedesktop.systemd1.manage-units" &&
                    action.lookup("unit") == "chezmoi-server-package-converge.service" &&
                    action.lookup("verb") == "start" &&
                    subject.user == "{{ non_root_user }}") {
                  return polkit.Result.YES;
                }
              });

        # The converge only pulls, so on a host that has never applied the
        # listener, install its files first. Under `czu` the outer chezmoi holds
        # the state lock and this nested apply fails; the listener is then
        # installed and started by run_onchange_after_ensure-sync-listener.
        - name: Check for the push listener unit
          ansible.builtin.stat:
            path: "{{ st.home }}/.config/systemd/user/chezmoi-sync-listener.service"
          register: listener_unit

        - name: Install the push listener's files
          ansible.builtin.command:
            argv:
              - chezmoi
              - apply
              - --no-tty
              - "{{ st.home }}/.local/bin/chezmoi-autoupdate"
              - "{{ st.home }}/.local/bin/chezmoi-sync-listener"
              - "{{ st.home }}/.config/systemd/user/chezmoi-sync-listener.service"
          register: listener_install
          changed_when: listener_install.rc == 0
          failed_when: false
          when: not listener_unit.stat.exists
          become: true
          become_user: "{{ non_root_user }}"

        - name: Enable the push listener that pulls and applies dotfiles
          ansible.builtin.systemd_service:
            name: chezmoi-sync-listener.service
            scope: user
            daemon_reload: true
            enabled: true
            state: started
          when: listener_unit.stat.exists or (listener_install.rc | default(1)) == 0
          become: true
          become_user: "{{ non_root_user }}"
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ st.uid }}"

        - name: Enable the root package convergence timer
          ansible.builtin.systemd_service:
            name: chezmoi-server-package-converge.timer
            daemon_reload: true
            enabled: true
            state: started

    # Sage stores complete commands in this SQLite database. The directory mode
    # protects the database and its transient WAL files regardless of their mode.
    - name: Secure Zsh Sage state directory
      ansible.builtin.file:
        path: "{{ st.home }}/.zsh-sage"
        state: directory
        mode: "0700"
      become: "{{ as_user }}"
      become_user: "{{ non_root_user }}"
