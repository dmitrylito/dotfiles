# NoiseTorch writes its RNNoise LADSPA plugin to /tmp/librnnoise-*.so and asks
# pipewire-pulse to load it by absolute path through module-ladspa-source.
# Since PipeWire 1.6 that module sets library.filter-path=true, which only accepts
# absolute paths inside a LADSPA_PATH directory; anything else fails with ENOENT
# ("failed to load plugin ... No such file or directory"). The first three entries
# are PipeWire's built-in defaults; /tmp is added for NoiseTorch.
[Service]
Environment=LADSPA_PATH=/usr/lib64/ladspa:/usr/lib/ladspa:/usr/lib:/tmp
