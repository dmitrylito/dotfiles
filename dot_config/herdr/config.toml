onboarding = false
# Herdr is the universal terminal workspace and multiplexer.

[theme]
# Follow the terminal palette with blue accents.
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# New panes and workspaces inherit the current working directory.
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter", "prefix+minus"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

# Direct bindings: Herdr sees these before the pane app does, including inside
# Neovim. Ctrl+L therefore navigates instead of clearing the shell.
focus_pane_left = "ctrl+h"
focus_pane_down = ["ctrl+j", "prefix+j"]
focus_pane_up = "ctrl+k"
focus_pane_right = ["ctrl+l", "prefix+l"]

# Swap the focused pane with its neighbor. prefix+shift+k is not free
# (close_workspace), so swaps live on prefix+ctrl instead of prefix+shift.
swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"

resize_mode = [
  "prefix+ctrl+left",
  "prefix+ctrl+down",
  "prefix+ctrl+up",
  "prefix+ctrl+right",
]

# Herdr's default prefix+shift+p is taken by previous workspace.
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = ["prefix+r", "prefix+shift+t"]
close_tab = ["prefix+k", "prefix+shift+x"]
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+h"]
next_tab = ["prefix+n", "alt+right", "alt+l"]

# Pickers — goto moved off prefix+g because lazygit takes that key below.
workspace_picker = "prefix+w"
goto = "prefix+a"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = ["prefix+shift+r", "prefix+shift+w"]
close_workspace = ["prefix+shift+k", "prefix+shift+d"]
previous_workspace = ["prefix+shift+p", "alt+k"]
next_workspace = ["prefix+shift+n", "alt+down", "alt+j"]

# Agents — alt+shift mirrors the alt workspace keys
focus_agent = ["alt+shift+1..9", "ctrl+alt+1..9"]
previous_agent = "alt+shift+k"
next_agent = "alt+shift+j"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "drovr.move-pane"
description = "move pane to tab"

[[keys.command]]
key = "prefix+M"
type = "plugin_action"
command = "drovr.move-tab"
description = "move tab to workspace"

# Lazygit popup
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[ui]
accent = "blue"
sidebar_width = 18

# Single-line dividers without extra gaps.
pane_gaps = false
pane_borders = true

# Keep the full pane width available to terminal applications.
pane_scrollbars = false

# Closing tabs and workspaces does not require confirmation.
confirm_close = false

# Let applications supply tab names without prompting at creation.
prompt_new_tab_name = false

# Mouse selection and pane interaction.
mouse_capture = true

# Written by herdr's settings UI; keep in sync here or apply stomps it
agent_panel_sort = "spaces"

# "copied to clipboard" toast off — it flashes on every copy-mode yank and mouse
# selection with copy_on_select
[ui.toast.clipboard]
enabled = false

# Agent done/request chimes off — the dlco remote session was dinging on every
# Claude turn-end with no visible notification (see herdr-agent-sounds memory)
[ui.sound]
enabled = false
